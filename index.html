<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Escolar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BASE
        ============================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                #eef3f8;

            color: #18324b;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /* ==============================
           FUNDO
        ============================== */

        .background {

            position: fixed;

            inset: 0;

            z-index: 0;

            overflow: hidden;

            background:
                #eaf0f6;
        }


        /*
         * IMAGEM GRANDE
         *
         * Futuramente você pode trocar
         * por uma foto real da escola.
         */

        .background::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:

                linear-gradient(
                    90deg,
                    rgba(238,243,248,0.98) 0%,
                    rgba(238,243,248,0.94) 35%,
                    rgba(238,243,248,0.68) 60%,
                    rgba(238,243,248,0.35) 100%
                ),

                url("escola.jpg");

            background-size: cover;

            background-position: center;

            transform: scale(1.03);
        }


        /*
         * Camada azul muito suave
         */

        .background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    135deg,
                    rgba(13,55,92,0.08),
                    rgba(35,111,171,0.04)
                );
        }


        /* ==============================
           DECORAÇÃO
        ============================== */

        .circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(20px);

            opacity: 0.10;

        }


        .circle.one {

            width: 450px;

            height: 450px;

            background: #2c78b8;

            top: -250px;

            left: -180px;
        }


        .circle.two {

            width: 400px;

            height: 400px;

            background: #75a9d1;

            bottom: -220px;

            right: -150px;
        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {

            position: relative;

            z-index: 2;

            width: 92%;

            max-width: 820px;

            text-align: center;

            padding: 55px 45px;

            background:
                rgba(255,255,255,0.91);

            border:

                1px solid
                rgba(255,255,255,0.85);

            border-radius: 18px;

            box-shadow:

                0 20px 60px
                rgba(20,52,80,0.16);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            animation:
                aparecer 0.7s ease;
        }


        /* ==============================
           LOGO
        ============================== */

        .logo {

            width: 105px;

            height: 105px;

            margin:
                0 auto 25px;

            border-radius: 18px;

            background:

                #f5f8fb;

            display: flex;

            align-items: center;

            justify-content: center;

            border:

                1px solid
                #dbe5ee;

            overflow: hidden;

            box-shadow:

                0 8px 25px
                rgba(20,52,80,0.08);
        }


        .logo img {

            width: 86%;

            height: 86%;

            object-fit: contain;
        }


        .logo-fallback {

            font-size: 48px;
        }


        /* ==============================
           TÍTULO
        ============================== */

        h1 {

            font-size:

                clamp(
                    32px,
                    5vw,
                    50px
                );

            margin-bottom: 10px;

            letter-spacing: -1.2px;

            color:

                #173b5c;

            font-weight: 700;
        }


        .subtitulo {

            font-size:

                clamp(
                    17px,
                    2.5vw,
                    21px
                );

            color:

                #42627d;

            margin-bottom: 18px;
        }


        .descricao {

            max-width: 620px;

            margin:

                0 auto 32px;

            line-height: 1.7;

            color:

                #65798b;

            font-size: 15px;
        }


        /* ==============================
           BOTÃO
        ============================== */

        .botao {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            min-width: 225px;

            padding: 15px 30px;

            border-radius: 8px;

            border: none;

            background:

                #1769aa;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            box-shadow:

                0 7px 18px
                rgba(23,105,170,0.20);

            transition:

                0.25s;
        }


        .botao:hover {

            background:

                #125b93;

            transform:

                translateY(-2px);

            box-shadow:

                0 10px 25px
                rgba(23,105,170,0.25);
        }


        /* ==============================
           STATUS
        ============================== */

        .status {

            margin-top: 23px;

            font-size: 13px;

            color:

                #708394;
        }


        .ponto {

            display: inline-block;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background:

                #36a269;

            margin-right: 7px;

            box-shadow:

                0 0 7px
                rgba(54,162,105,0.45);
        }


        /* ==============================
           RODAPÉ
        ============================== */

        footer {
    position: fixed;
    bottom: 18px;
    right: 25px;
    left: auto;
    text-align: right;
    font-size: 12px;
    color: rgba(40, 65, 85, 0.55);
    z-index: 2;
}



        /* ==============================
           ANIMAÇÃO
        ============================== */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* ==============================
           CELULAR
        ============================== */

        @media (max-width: 600px) {

            body {

                overflow-y: auto;
            }


            .background::before {

                background-position:
                    65% center;

                background-image:

                    linear-gradient(
                        rgba(238,243,248,0.94),
                        rgba(238,243,248,0.98)
                    ),

                    url("escola.jpg");
            }


            .container {

                width: 92%;

                padding:
                    42px 22px;

                border-radius: 16px;
            }


            .logo {

                width: 90px;

                height: 90px;
            }


            .descricao {

                font-size: 14px;

                margin-bottom: 28px;
            }


            .botao {

                width: 100%;

                min-width: 0;
            }


            footer {

                position:
                    relative;

                margin-top: 18px;

                bottom: auto;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================
         FUNDO
    =========================== -->

    <div class="background">

        <div class="circle one"></div>

        <div class="circle two"></div>

    </div>



    <!-- ==========================
         PORTAL
    =========================== -->

    <main class="container">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="logo.png"
                alt="Logo da escola"
            >

            <div class="logo-fallback"></div>

        </div>



        <!-- TÍTULO -->

        <h1>
            ÁGAPE - Espaço Pedagógico 
        </h1>



        <div class="subtitulo">

            Bem-vindo ao ambiente escolar

        </div>



        <p class="descricao">

            Um ambiente integrado para direção,
            professores, alunos, responsáveis
            e equipe administrativa.

        </p>



        <!-- BOTÃO -->

        <a
            id="entrar"
            class="botao"
            href="#"
        >

            🔐 Entrar no Portal

        </a>



        <!-- STATUS -->

        <div class="status">

            <span class="ponto"></span>

            Sistema disponível

        </div>


    </main>



    <!-- ==========================
         RODAPÉ
    =========================== -->

    <footer>

        by Janderson Sousa

    </footer>



    <!-- ==========================
         GIBBON
    =========================== -->

    <script>

        /*
         * O endereço do Gibbon será carregado
         * automaticamente pelo servidor.
         */

        async function carregarServidor() {

            try {

                const resposta =
                    await fetch(
                        "config.json",
                        {
                            cache: "no-store"
                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Não foi possível carregar o servidor."
                    );

                }


                const configuracao =
                    await resposta.json();


                const servidor =
                    configuracao.servidor;


                if (!servidor) {

                    throw new Error(
                        "Endereço do servidor não encontrado."
                    );

                }


                const botao =
                    document.getElementById("entrar");


                /*
                 * Login do Gibbon
                 */

                botao.href =
                    servidor + "/login.php";


                /*
                 * Redirecionamento automático
                 * opcional.
                 */

                // setTimeout(() => {
                //
                //     window.location.href =
                //         servidor + "/login.php";
                //
                // }, 5000);


            } catch (erro) {

                console.error(erro);


                document.querySelector(
                    ".status"
                ).innerHTML =

                    '<span style="color:#d9534f;">● Sistema temporariamente indisponível</span>';

            }

        }


        carregarServidor();

    </script>


</body>

</html>
